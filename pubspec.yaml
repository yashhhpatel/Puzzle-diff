name: sparkle_sort
description: "Diamond Picture Puzzle - sort diamonds into place to complete pixel-art pictures."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.4.0
  shared_preferences: ^2.3.3
  in_app_purchase: ^3.2.0
  google_mobile_ads: ^5.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sfx/

  fonts:
    - family: Lilita
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Baloo
      fonts:
        - asset: assets/fonts/Baloo2.ttf
